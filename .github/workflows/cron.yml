name: Controlla UST Brescia

on:
  schedule:
    # Esegue ogni 5 minuti dalle 07:00 alle 22:00 italiane (05:00-20:00 UTC)
    - cron: '*/5 5-19 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests beautifulsoup4
      - run: python bot_ust.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Salva stato
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add viste.json
          git commit -m "Update registri" || exit 0
          git push
